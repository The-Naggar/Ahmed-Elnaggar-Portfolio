<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brilliant Silver-White Lunar Radial Gradient -->
    <radialGradient id="whiteMoonGlow" cx="36%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="92%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <!-- Soft White Atmospheric Aura Filter -->
    <filter id="whiteHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Subtle Slate Crater Shadows -->
    <radialGradient id="craterSlate" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(100, 116, 139, 0.28)" />
      <stop offset="100%" stop-color="rgba(71, 85, 105, 0.50)" />
    </radialGradient>
  </defs>
  
  <!-- Outer Pure White Glowing Atmospheric Aura -->
  <circle cx="32" cy="32" r="27" fill="#ffffff" opacity="0.4" filter="url(#whiteHalo)" />
  
  <!-- Main Pearlescent White Moon Sphere -->
  <circle cx="32" cy="32" r="23" fill="url(#whiteMoonGlow)" />
  
  <!-- Natural Lunar Craters (Maria) -->
  <circle cx="25" cy="21" r="4.2" fill="url(#craterSlate)" />
  <circle cx="38" cy="25" r="3.4" fill="url(#craterSlate)" />
  <circle cx="27" cy="36" r="5.2" fill="url(#craterSlate)" />
  <circle cx="41" cy="37" r="2.8" fill="url(#craterSlate)" />
  <circle cx="19" cy="30" r="2.4" fill="url(#craterSlate)" />
  <circle cx="34" cy="44" r="3.6" fill="url(#craterSlate)" />
</svg>